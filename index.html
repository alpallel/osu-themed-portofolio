<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>osu!lazer — triangles (cYsmix)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- osu!lazer Themed Loading Screen -->
  <div id="loading-screen" aria-label="Loading assets">
    <div class="loading-content">
      <div class="loading-bar-wrap">
        <div id="loading-bar-fill" class="loading-bar-fill"></div>
      </div>
      <div class="loading-status-wrap">
        <span id="loading-status" class="loading-status">loading assets...</span>
        <span id="loading-percent" class="loading-percent">0%</span>
      </div>
    </div>
  </div>

  <main id="stage-viewport">
    <canvas id="intro-canvas" aria-label="osu!lazer triangles intro"></canvas>
  </main>

  <!-- DOM main menu (the intro itself remains on canvas) -->
  <section id="menu-screen" aria-label="Main menu" aria-hidden="true">
    <div id="menu-background" aria-hidden="true">
      <img id="menu-bg-image" alt="" decoding="async" draggable="false" />
      <div id="menu-bg-dim"></div>
      <div id="menu-glow-left" class="menu-glow"></div>
      <div id="menu-glow-right" class="menu-glow"></div>
    </div>

    <div id="menu-logo-anchor">
      <div id="menu-logo-scale">
        <div id="menu-ripples" aria-hidden="true"></div>
        <button id="menu-logo" type="button" aria-label="osu! logo">
          <span class="menu-logo-ring">
            <span class="menu-logo-inner">
              <img id="menu-pfp" alt="Profile picture" decoding="async" draggable="false" />
              <span class="menu-logo-shade" aria-hidden="true"></span>
              <span id="menu-logo-dim" aria-hidden="true"></span>
            </span>
          </span>
        </button>
      </div>
    </div>

    <!-- Portfolio content can be added here later. -->
  </section>

  <div id="drop-flash" aria-hidden="true"></div>

  <!-- Auto-hiding transport HUD (top-right hover or press H) -->
  <nav id="hud-bar" aria-label="Playback controls">
    <button id="btn-replay" class="hud-btn" type="button" title="Replay Intro (R)">
      Replay
    </button>
    <button id="btn-play-pause" class="hud-btn" type="button" title="Play / Pause (Space)">
      Pause
    </button>
    <input id="hud-scrubber" type="range" min="0" max="100" step="0.05" value="0" aria-label="Timeline scrubber" />
    <span id="hud-time">0:00.00</span>
  </nav>

  <script src="logo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
